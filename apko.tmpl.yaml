# Rendered by scripts/render.sh -> build/<version>/apko.yaml (runtime) and apko-dev.yaml.
contents:
  # The locally built apk repository and its signing key are appended at
  # build time (apko -r/-k, or the apko-publish action's repository-append).
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - node-hotfix=@@VERSION@@-r0
# @@DEV_PACKAGES@@

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /app

environment:
  NODE_ENV: production

entrypoint:
  command: /usr/bin/node

annotations:
  org.opencontainers.image.title: node-hotfix@@FLAVOR_SUFFIX@@
  org.opencontainers.image.version: "@@VERSION@@"

archs:
  - x86_64
  - aarch64
