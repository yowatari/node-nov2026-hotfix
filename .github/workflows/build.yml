name: build

# PRs build and test only. main, the daily schedule and manual runs publish.
# Each version is skipped when its inputs (melange + apko config)
# were already published, and apks are cached per arch, so a typical run only
# rebuilds what changed.
on:
  push:
    branches: [main]
    paths:
      - melange.tmpl.yaml
      - apko.tmpl.yaml
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - melange.tmpl.yaml
      - apko.tmpl.yaml
      - scripts/**
      - .github/workflows/build.yml
  schedule:
    # Re-run apko daily so images pick up Wolfi base fixes (node is not refetched).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON list of Node.js versions, e.g. ["24.22.3"]'
        required: false
        default: ""
      force:
        description: Republish images even if their inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Supported release lines. Bump these to the fixed versions on release day.
  DEFAULT_VERSIONS: '["26.13.0","24.22.2","22.23.4"]'
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  # The schedule exists to refresh base packages, so it always republishes.
  FORCE: ${{ inputs.force || github.event_name == 'schedule' }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.versions }}
        run: echo "versions=${INPUT:-$DEFAULT_VERSIONS}" >> "$GITHUB_OUTPUT"

  # One native build per arch, so melange's package tests run the real binary.
  # Runners are pinned to 24.04 (x64 and arm) instead of ubuntu-latest, which
  # moves to 26.04 from 2026-10-19: melange-build's bubblewrap/AppArmor setup
  # targets 24.04, and both arches should build on the same base.
  packages:
    needs: matrix
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Render melange/apko config
        id: render
        run: scripts/render.sh "${{ matrix.version }}"

      - name: Already published?
        id: skip
        env:
          HASH: ${{ steps.render.outputs.image_hash }}
        run: |
          skip=false
          if [ "$PUBLISH" = true ] && [ "$FORCE" != true ] &&
            docker buildx imagetools inspect "${IMAGE,,}:build-$HASH" > /dev/null 2>&1; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Restore apks
        if: steps.skip.outputs.skip != 'true'
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.render.outputs.dir }}/packages/${{ matrix.arch }}
            keys/${{ matrix.arch }}.rsa.pub
          key: apk-${{ matrix.version }}-${{ matrix.arch }}-${{ steps.render.outputs.melange_hash }}

      - name: Prepare key dir
        if: steps.skip.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p keys

      # Installs melange + bubblewrap on the runner, generates a throwaway
      # signing key, then fetches (sha256-pinned), packages and tests the apks.
      - name: melange build (fetch, package, test)
        if: steps.skip.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: chainguard-dev/actions/melange-build@53668650c25af6e8864f1d1ddaa69ed4db4cdf09 # v1.6.42
        with:
          version: v0.63.0
          config: ${{ steps.render.outputs.dir }}/melange.yaml
          repository-path: ${{ github.workspace }}/${{ steps.render.outputs.dir }}/packages
          archs: ${{ matrix.arch }}
          sign-with-temporary-key: true
          signing-key-path: ${{ github.workspace }}/keys/${{ matrix.arch }}.rsa

      - name: Drop the private key
        if: steps.skip.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -f "keys/${{ matrix.arch }}.rsa"
          sudo chown -R "$(id -u):$(id -g)" keys

      - name: Upload apks
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.version }}-${{ matrix.arch }}
          path: |
            ${{ steps.render.outputs.dir }}/packages/${{ matrix.arch }}
            keys/${{ matrix.arch }}.rsa.pub
          retention-days: 1
          if-no-files-found: error

  # Assemble one multi-arch image per flavour from both arches' apks.
  image:
    needs: [matrix, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Render melange/apko config
        id: render
        run: scripts/render.sh "${{ matrix.version }}"

      - name: Already published?
        id: skip
        env:
          HASH: ${{ steps.render.outputs.image_hash }}
        run: |
          skip=false
          if [ "$PUBLISH" = true ] && [ "$FORCE" != true ] &&
            docker buildx imagetools inspect "${IMAGE,,}:build-$HASH" > /dev/null 2>&1; then
            skip=true
            echo "### Node.js ${{ matrix.version }}: unchanged (build-$HASH already published), skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Download apks
        if: steps.skip.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: apk-${{ matrix.version }}-*
          merge-multiple: true

      - name: Trust the per-arch melange keys in apko configs
        if: steps.skip.outputs.skip != 'true'
        env:
          DIR: ${{ steps.render.outputs.dir }}
        run: |
          ls -R "$DIR/packages" keys
          for f in "$DIR/apko.yaml" "$DIR/apko-dev.yaml"; do
            for k in keys/*.rsa.pub; do
              sed -i "\|wolfi-signing.rsa.pub|a\    - $GITHUB_WORKSPACE/$k" "$f"
            done
          done
          grep -A3 '^  keyring:' "$DIR/apko.yaml"

      - uses: docker/setup-qemu-action@v4
        if: steps.skip.outputs.skip != 'true'

      # ---- pull requests: build locally and test both arches, no push ----
      - name: apko build + smoke test (no publish)
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH != 'true'
        env:
          DIR: ${{ steps.render.outputs.dir }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          for flavor in rt dev; do
            cfg="$DIR/apko.yaml"; [ "$flavor" = dev ] && cfg="$DIR/apko-dev.yaml"
            docker run --rm -v "$PWD":"$PWD" -w "$PWD" cgr.dev/chainguard/apko:latest \
              build "$cfg" "node-hotfix:$flavor" "$DIR/image-$flavor.tar" \
              -r "$PWD/$DIR/packages"
            docker load < "$DIR/image-$flavor.tar"
          done
          scripts/smoke.sh node-hotfix:rt-amd64 node-hotfix:dev-amd64 "$VERSION" linux/amd64
          scripts/smoke.sh node-hotfix:rt-arm64 node-hotfix:dev-arm64 "$VERSION" linux/arm64

      # ---- main / schedule / dispatch: publish, test, sign ----
      - name: Image tags
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        id: tags
        env:
          VERSION: ${{ steps.render.outputs.version }}
          MAJOR: ${{ steps.render.outputs.major }}
        run: |
          image="${IMAGE,,}"
          for flavor in "" -dev; do
            tags="$image:$VERSION-r0$flavor $image:$VERSION$flavor $image:$MAJOR$flavor"
            echo "tags${flavor//-/_}=$tags" >> "$GITHUB_OUTPUT"
          done

      - name: apko publish (node runtime image + SBOM)
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
        with:
          config: ${{ steps.render.outputs.dir }}/apko.yaml
          tag: ${{ steps.tags.outputs.tags }}
          repository-append: ${{ github.workspace }}/${{ steps.render.outputs.dir }}/packages

      - name: apko publish (node -dev image + SBOM)
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
        with:
          config: ${{ steps.render.outputs.dir }}/apko-dev.yaml
          tag: ${{ steps.tags.outputs.tags_dev }}
          repository-append: ${{ github.workspace }}/${{ steps.render.outputs.dir }}/packages

      - name: Resolve digests
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        id: publish
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          TAGS_DEV: ${{ steps.tags.outputs.tags_dev }}
          VERSION: ${{ steps.render.outputs.version }}
          SIGNED_BY: ${{ steps.render.outputs.signed_by }}
        run: |
          {
            echo "### Node.js $VERSION (linux/amd64, linux/arm64)"
            echo
            echo "- SHASUMS256.txt signed by: $SIGNED_BY"
          } >> "$GITHUB_STEP_SUMMARY"
          for flavor in "" -dev; do
            var="TAGS${flavor//-/_}"; var="${var^^}"
            read -ra tags <<< "${!var}"
            # Pin to the digest the tags resolve to (the OCI index), not a per-arch manifest.
            digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
            ref="${IMAGE,,}@$digest"
            echo "ref${flavor//-/_}=$ref" >> "$GITHUB_OUTPUT"
            {
              echo "- digest${flavor}: \`$ref\`"
              printf -- '  - tag: `%s`\n' "${tags[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Smoke test (amd64 + arm64)
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        env:
          REF: ${{ steps.publish.outputs.ref }}
          REF_DEV: ${{ steps.publish.outputs.ref_dev }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          scripts/smoke.sh "$REF" "$REF_DEV" "$VERSION" linux/amd64
          scripts/smoke.sh "$REF" "$REF_DEV" "$VERSION" linux/arm64

      # apko-publish authenticates on its own; cosign needs a docker login.
      - uses: docker/login-action@v4
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'

      - name: cosign sign (keyless)
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        env:
          REF: ${{ steps.publish.outputs.ref }}
          REF_DEV: ${{ steps.publish.outputs.ref_dev }}
        # --recursive signs the index and every per-arch manifest under it
        run: cosign sign --yes --recursive "$REF" "$REF_DEV"

      - name: cosign verify (by tag, as users will)
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        env:
          MAJOR: ${{ steps.render.outputs.major }}
        run: |
          for tag in "${IMAGE,,}:$MAJOR" "${IMAGE,,}:$MAJOR-dev"; do
            cosign verify "$tag" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified $tag"
          done

      # Marker that lets later runs skip this version. Written last, so a
      # failed publish/sign is retried next time.
      - name: Mark inputs as published
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        env:
          REF: ${{ steps.publish.outputs.ref }}
          HASH: ${{ steps.render.outputs.image_hash }}
        run: docker buildx imagetools create --tag "${IMAGE,,}:build-$HASH" "$REF"

      # Trivy + Grype scan; results are attached to the image as signed
      # cosign vuln attestations. Informational: does not fail the build.
      - name: Vulnerability scan + attestation
        if: steps.skip.outputs.skip != 'true' && env.PUBLISH == 'true'
        uses: chainguard-images/actions/vul-scans@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
        with:
          image: ${{ steps.publish.outputs.ref }}
          RUN_SNYK: "false"
